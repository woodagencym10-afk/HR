<!DOCTYPE html>
<html>
<body>
  <h2>Вхід</h2>
  <input type="text" id="login" placeholder="Логін">
  <input type="password" id="password" placeholder="Пароль">
  <button onclick="handleLogin()">УВІЙТИ</button>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';

    async function handleLogin() {
      const login = document.getElementById('login').value;
      const pass = document.getElementById('password').value;
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', login: login, password: pass })
        });
        
        const result = await response.json();
        
        if (result.success) {
          localStorage.setItem('hr_user', login);
          localStorage.setItem('hr_pass', pass);
          localStorage.setItem('hr_role', result.role);
          window.location.href = result.role === 'user' ? 'knowledge.html' : 'index.html';
        } else {
          alert('Невірний логін або пароль');
        }
      } catch(e) {
        alert('Помилка сервера: ' + e);
      }
    }
  </script>
</body>
</html>
