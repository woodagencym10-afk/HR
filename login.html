<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>HR Portal | Вхід</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen font-sans">

  <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-96 border border-gray-700">
    <h2 class="text-white text-2xl font-bold mb-6 text-center">HR System Login</h2>
    <input type="password" id="password" placeholder="Ваш індивідуальний пароль" 
           class="w-full p-4 mb-4 bg-gray-900 text-white rounded-xl border border-gray-700 focus:border-blue-500 outline-none">
    <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold transition">
      УВІЙТИ
    </button>
  </div>

  <script>
    const API_URL = 'ВАШ_ЛІНК_З_GOOGLE_SCRIPT';

    async function handleLogin() {
      const pass = document.getElementById('password').value;
      
      // Перевіряємо пароль через скрипт
      try {
        const response = await fetch(API_URL + '?action=check&password=' + pass);
        const result = await response.json();
        
        if (result.success) {
          localStorage.setItem('hr_pass', pass);
          localStorage.setItem('hr_role', result.role);
          window.location.href = 'index.html'; // Перекидаємо на головну
        } else {
          alert('Невірний пароль');
        }
      } catch(e) { alert('Помилка сервера'); }
    }
  </script>
</body>
</html>
