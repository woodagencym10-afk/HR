<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HR Portal | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-700">

    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold shadow-lg">
        HR
      </div>

      <h1 class="text-3xl font-bold text-white mt-5">
        HR Portal
      </h1>

      <p class="text-gray-400 mt-2">
        Авторизація в системі
      </p>
    </div>

    <div class="space-y-5">

      <div>
        <label class="text-sm text-gray-300 block mb-2">
          Пароль
        </label>

        <input
          type="password"
          id="password"
          placeholder="Введіть пароль"
          class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <button
        id="loginBtn"
        onclick="handleLogin()"
        class="w-full bg-blue-600 hover:bg-blue-500 transition text-white font-bold py-4 rounded-xl"
      >
        УВІЙТИ
      </button>

      <div
        id="errorBox"
        class="hidden bg-red-500/20 border border-red-500 text-red-300 text-sm p-3 rounded-xl"
      >
        Невірний пароль
      </div>

    </div>

  </div>

  <script>

    // ВСТАВ СВІЙ GOOGLE SCRIPT URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';

    async function handleLogin() {

      const password = document.getElementById('password').value;
      const button = document.getElementById('loginBtn');
      const errorBox = document.getElementById('errorBox');

      errorBox.classList.add('hidden');

      if (!password) {
        showError('Введіть пароль');
        return;
      }

      button.disabled = true;
      button.innerHTML = 'Завантаження...';

      try {

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify({
            action: 'login',
            password: password
          })
        });

        const result = await response.json();

        if (result.success) {

          localStorage.setItem('hr_token', result.token);
          localStorage.setItem('hr_role', result.role);

          window.location.href = 'index.html';

        } else {

          showError('Невірний пароль');

        }

      } catch (error) {

        console.error(error);
        showError('Помилка сервера');

      }

      button.disabled = false;
      button.innerHTML = 'УВІЙТИ';
    }

    function showError(text) {
      const errorBox = document.getElementById('errorBox');

      errorBox.innerText = text;
      errorBox.classList.remove('hidden');
    }

    // LOGIN НА ENTER
    document
      .getElementById('password')
      .addEventListener('keydown', function(e) {

        if (e.key === 'Enter') {
          handleLogin();
        }

      });

  </script>

</body>
</html>
