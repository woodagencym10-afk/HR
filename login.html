<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Portal — Вхід</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #3B82F6;
    --blue-dark: #2563EB;
    --blue-light: #EFF6FF;
    --green: #22C55E;
    --green-light: #F0FDF4;
    --red: #EF4444;
    --red-light: #FEF2F2;
    --ink: #111827;
    --ink-mid: #374151;
    --ink-light: #6B7280;
    --border: #E5E7EB;
    --bg: #F3F4F6;
    --white: #FFFFFF;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--white);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: var(--blue);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-light);
    margin-bottom: 28px;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-mid);
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    height: 48px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0 16px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    background: var(--white);
  }

  .field input::placeholder { color: #9CA3AF; }

  .btn {
    width: 100%;
    height: 48px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }

  .btn:hover { background: var(--blue-dark); }
  .btn:active { transform: scale(0.99); }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-icon">HR</div>
    <div class="logo-text">Portal</div>
  </div>
  <h1>Вхід до системи</h1>
  <p class="subtitle">Введіть свої дані для авторизації</p>

  <div class="field">
    <label>Логін</label>
    <input type="text" id="login" placeholder="Ваш логін">
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  <button class="btn" onclick="handleLogin()">Увійти</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';
async function handleLogin() {
  const login = document.getElementById('login').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!login || !password) { alert('Заповніть всі поля'); return; }
  try {
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'login', login, password }) });
    const result = await res.json();
    if (result.success) {
      localStorage.setItem('hr_user', login);
      localStorage.setItem('hr_pass', password);
      localStorage.setItem('hr_role', result.role);
      localStorage.setItem('hr_logged', 'true');
      window.location.href = result.role === 'user' ? 'knowledge.html' : 'index.html';
    } else {
      alert('Помилка: ' + (result.error || 'Невірний логін або пароль'));
    }
  } catch(e) { alert('Помилка сервера: ' + e); }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
