<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HR Portal | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-gray-800 rounded-3xl shadow-2xl p-8 border border-gray-700">

    <div class="text-center mb-8">

      <div class="w-20 h-20 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold">
        HR
      </div>

      <h1 class="text-3xl font-bold text-white mt-5">
        HR Portal
      </h1>

      <p class="text-gray-400 mt-2">
        Авторизація в системі
      </p>

    </div>

    <div class="space-y-5">

      <input
        type="password"
        id="password"
        placeholder="Введіть пароль"
        class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
      >

      <button
        id="loginBtn"
        onclick="handleLogin()"
        class="w-full bg-blue-600 hover:bg-blue-500 transition text-white font-bold py-4 rounded-xl"
      >
        УВІЙТИ
      </button>

      <div
        id="errorBox"
        class="hidden bg-red-500/20 border border-red-500 text-red-300 text-sm p-3 rounded-xl"
      >
      </div>

    </div>

  </div>

<script>

const API_URL = 'ТУТ_ВСТАВ_СВІЙ_GOOGLE_SCRIPT_URL';

async function handleLogin() {

  const password = document.getElementById('password').value;
  const button = document.getElementById('loginBtn');

  hideError();

  if (!password) {
    showError('Введіть пароль');
    return;
  }

  button.disabled = true;
  button.innerText = 'Перевірка...';

  try {

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain'
      },
      body: JSON.stringify({
        password: password
      })
    });

    const result = await response.json();

    if (result.success) {

      localStorage.setItem('hr_pass', password);
      localStorage.setItem('hr_role', result.role);

      window.location.href = 'index.html';

    } else {

      showError('Невірний пароль');

    }

  } catch (e) {

    console.error(e);
    showError('Помилка сервера');

  }

  button.disabled = false;
  button.innerText = 'УВІЙТИ';
}

function showError(text) {
  const box = document.getElementById('errorBox');

  box.innerText = text;
  box.classList.remove('hidden');
}

function hideError() {
  document.getElementById('errorBox').classList.add('hidden');
}

document
  .getElementById('password')
  .addEventListener('keydown', function(e) {

    if (e.key === 'Enter') {
      handleLogin();
    }

  });

</script>

</body>
</html>
