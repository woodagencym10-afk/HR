<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';

async function handleLogin() {
  const pass = document.getElementById('password').value;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        action: 'login',
        password: pass
      })
    });

    const result = await response.json();

    if (result.success) {

      localStorage.setItem('hr_token', result.token);
      localStorage.setItem('hr_role', result.role);
      localStorage.setItem('hr_user', result.user);

      window.location.href = 'index.html';

    } else {
      alert('Невірний пароль');
    }

  } catch (e) {
    alert('Помилка сервера');
    console.error(e);
  }
}
</script>
