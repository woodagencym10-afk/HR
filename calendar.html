<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Portal — Календар відсутностей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #3B82F6;
    --blue-dark: #2563EB;
    --blue-light: #EFF6FF;
    --green: #22C55E;
    --green-light: #F0FDF4;
    --green-text: #16A34A;
    --red: #EF4444;
    --red-light: #FEF2F2;
    --red-text: #DC2626;
    --orange: #F59E0B;
    --orange-light: #FEF3C7;
    --orange-text: #D97706;
    --ink: #111827;
    --ink-mid: #374151;
    --ink-light: #6B7280;
    --border: #E5E7EB;
    --bg: #F3F4F6;
    --white: #FFFFFF;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 64px;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--blue);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 17px; font-weight: 700; color: var(--ink);
    margin-right: 8px;
  }

  .nav { display: flex; gap: 4px; }

  .nav-btn {
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 14px; font-weight: 500;
    color: var(--ink-light);
    background: none; border: none;
    cursor: pointer; text-decoration: none;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }

  .nav-btn:hover { background: var(--bg); color: var(--ink); }
  .nav-btn.active { background: var(--blue-light); color: var(--blue); }
  .nav-btn.danger { color: var(--red); }
  .nav-btn.danger:hover { background: var(--red-light); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* ── PAGE ── */
  .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--ink); }

  /* ── CALENDAR ── */
  .calendar-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .calendar-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .month-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    min-width: 170px;
    text-align: center;
    text-transform: capitalize;
  }

  .btn-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink-mid);
    transition: all 0.2s;
  }

  .btn-icon:hover { background: var(--border); color: var(--ink); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .day-name {
    padding: 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-light);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }

  .calendar-cell {
    min-height: 120px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 8px;
    position: relative;
    background: var(--white);
    transition: background 0.2s;
  }

  .calendar-cell:nth-child(7n) { border-right: none; }
  .calendar-cell.empty { background: var(--bg); }
  .calendar-cell.today { background: var(--blue-light); }

  .date-number {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-mid);
    margin-bottom: 8px;
    display: inline-block;
  }
  
  .calendar-cell.today .date-number {
    color: var(--blue);
    font-weight: 700;
  }

  .cell-add-btn {
    position: absolute;
    top: 6px; right: 6px;
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--blue);
    color: white;
    border: none;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    display: flex; align-items: center; justify-content: center;
  }

  .calendar-cell:hover .cell-add-btn { opacity: 1; }
  .cell-add-btn:hover { background: var(--blue-dark); }

  /* Event Chips */
  .event-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .event-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .event-chip:hover { opacity: 0.8; }

  .event-vacation { background: var(--green-light); color: var(--green-text); border: 1px solid #bbf7d0; }
  .event-dayoff { background: var(--orange-light); color: var(--orange-text); border: 1px solid #fde68a; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(17, 24, 39, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.active { opacity: 1; pointer-events: all; }

  .modal-card {
    background: var(--white);
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    padding: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    transform: translateY(20px);
    transition: transform 0.2s;
  }

  .modal-overlay.active .modal-card { transform: translateY(0); }

  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }

  .modal-title { font-size: 18px; font-weight: 700; color: var(--ink); }

  .close-btn {
    background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-light);
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 500; color: var(--ink-light); margin-bottom: 6px;
  }
  
  .field select, .field input {
    width: 100%; height: 42px; background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 10px; padding: 0 12px; font-family: 'Inter', sans-serif; font-size: 14px;
    color: var(--ink); outline: none; transition: border-color 0.2s;
  }
  
  .field select:focus, .field input:focus { border-color: var(--blue); background: var(--white); }
  
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-submit {
    width: 100%; height: 44px; background: var(--blue); color: white; border: none;
    border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.2s; margin-top: 8px;
  }
  .btn-submit:hover { background: var(--blue-dark); }
  
  .btn-delete {
    width: 100%; height: 40px; background: none; color: var(--red); border: none;
    border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; margin-top: 8px; display: none;
  }
  .btn-delete:hover { background: var(--red-light); }

  @media (max-width: 768px) {
    .calendar-grid { grid-template-columns: repeat(1, 1fr); }
    .day-name { display: none; }
    .calendar-cell { min-height: 80px; }
    .cell-add-btn { opacity: 1; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo-icon">HR</div>
  <div class="logo-text">Portal</div>
  <nav class="nav">
    <a href="index.html" class="nav-btn">Працівники</a>
    <a href="calendar.html" class="nav-btn active">Календар</a>
    <a href="knowledge.html" class="nav-btn">База знань</a>
  </nav>
  <div class="header-right">
    <button onclick="logout()" class="nav-btn danger">Вийти</button>
  </div>
</header>

<!-- PAGE -->
<div class="page">
  <div class="page-header">
    <div class="page-title">Відпустки та Вихідні</div>
  </div>

  <div class="calendar-card">
    <div class="calendar-toolbar">
      <div class="month-nav">
        <button class="btn-icon" onclick="changeMonth(-1)">❮</button>
        <div class="month-title" id="month-year-label">—</div>
        <button class="btn-icon" onclick="changeMonth(1)">❯</button>
      </div>
      <button class="btn-icon" onclick="goToToday()" style="width: auto; padding: 0 12px; font-size: 13px; font-weight: 500;">Сьогодні</button>
    </div>

    <!-- Calendar Header -->
    <div class="calendar-grid" id="calendar-header">
      <div class="day-name">Пн</div>
      <div class="day-name">Вт</div>
      <div class="day-name">Ср</div>
      <div class="day-name">Чт</div>
      <div class="day-name">Пт</div>
      <div class="day-name" style="color: var(--red);">Сб</div>
      <div class="day-name" style="color: var(--red);">Нд</div>
    </div>

    <!-- Calendar Body -->
    <div class="calendar-grid" id="calendar-body"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="event-modal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Додати подію</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <form id="event-form" onsubmit="saveEvent(event)">
      <input type="hidden" id="event-id">

      <div class="field">
        <label>Тип відсутності</label>
        <select id="event-type" required onchange="toggleDateRange()">
          <!-- Тепер Вихідний на першому місці -->
          <option value="dayoff">🛋️ Вихідний</option>
          <option value="vacation">🌴 Відпустка</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Дата початку</label>
          <input type="date" id="event-start-date" required onchange="syncEndDate()">
        </div>
        <div class="field" id="end-date-field">
          <label>Дата закінчення</label>
          <input type="date" id="event-end-date" required>
        </div>
      </div>

      <div class="field">
        <label>Працівник</label>
        <select id="event-employee" required>
          <option value="">Оберіть працівника...</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Зберегти</button>
      <button type="button" class="btn-delete" id="btn-delete" onclick="deleteEvent()">Видалити</button>
    </form>
  </div>
</div>

<script>
if (!localStorage.getItem('hr_logged')) window.location.href = 'login.html';
function logout() { localStorage.clear(); window.location.href = 'login.html'; }

// State
let currentDate = new Date();
let employees = [];
let events = [];

const months = [
  "Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
  "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"
];

window.onload = () => {
  loadData();
  renderCalendar();
};

function loadData() {
  const cachedEmp = localStorage.getItem('hr_employees_cache');
  if (cachedEmp) {
    employees = JSON.parse(cachedEmp).filter(e => e.status === 'Активний');
  }

  const select = document.getElementById('event-employee');
  employees.forEach(emp => {
    const opt = document.createElement('option');
    opt.value = emp.pib;
    opt.textContent = emp.pib;
    select.appendChild(opt);
  });

  const cachedEvents = localStorage.getItem('hr_events_cache');
  if (cachedEvents) {
    events = JSON.parse(cachedEvents);
  }
}

// Перевірка, чи потрапляє конкретний день у проміжок дат події
function getEventsForDate(dateStr) {
  const checkDate = new Date(dateStr);
  checkDate.setHours(0,0,0,0);

  return events.filter(evt => {
    const start = new Date(evt.startDate);
    start.setHours(0,0,0,0);
    const end = new Date(evt.endDate);
    end.setHours(0,0,0,0);
    return checkDate >= start && checkDate <= end;
  });
}

function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  
  document.getElementById('month-year-label').textContent = `${months[month]} ${year}`;
  
  const firstDayIndex = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  
  const startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
  
  const calendarBody = document.getElementById('calendar-body');
  calendarBody.innerHTML = '';
  
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
  const todayDate = today.getDate();

  for (let i = 0; i < startDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'calendar-cell empty';
    calendarBody.appendChild(cell);
  }

  for (let i = 1; i <= lastDay; i++) {
    const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
    const cell = document.createElement('div');
    cell.className = 'calendar-cell';
    if (isCurrentMonth && i === todayDate) cell.classList.add('today');

    const dayEvents = getEventsForDate(dateString);
    let eventsHtml = '<div class="event-list">';
    dayEvents.forEach(evt => {
      const typeClass = evt.type === 'vacation' ? 'event-vacation' : 'event-dayoff';
      eventsHtml += `<div class="event-chip ${typeClass}" onclick="editEvent('${evt.id}', event)">${evt.employee}</div>`;
    });
    eventsHtml += '</div>';

    cell.innerHTML = `
      <span class="date-number">${i}</span>
      <button class="cell-add-btn" onclick="openModal('${dateString}')">+</button>
      ${eventsHtml}
    `;
    calendarBody.appendChild(cell);
  }
}

function changeMonth(offset) {
  currentDate.setMonth(currentDate.getMonth() + offset);
  renderCalendar();
}

function goToToday() {
  currentDate = new Date();
  renderCalendar();
}

// Сховати/показати дату закінчення залежно від типу події
function toggleDateRange() {
  const type = document.getElementById('event-type').value;
  const endDateField = document.getElementById('end-date-field');
  if (type === 'dayoff') {
    endDateField.style.opacity = '0.4';
    syncEndDate();
  } else {
    endDateField.style.opacity = '1';
  }
}

function syncEndDate() {
  const type = document.getElementById('event-type').value;
  if (type === 'dayoff') {
    document.getElementById('event-end-date').value = document.getElementById('event-start-date').value;
  }
}

const modal = document.getElementById('event-modal');
const form = document.getElementById('event-form');

function openModal(dateStr) {
  form.reset();
  document.getElementById('event-id').value = '';
  document.getElementById('event-start-date').value = dateStr;
  document.getElementById('event-end-date').value = dateStr;
  document.getElementById('modal-title').textContent = 'Додати подію';
  document.getElementById('btn-delete').style.display = 'none';
  
  // Дефолт - вихідний
  document.getElementById('event-type').value = 'dayoff'; 
  
  toggleDateRange();
  modal.classList.add('active');
}

function closeModal() { modal.classList.remove('active'); }

function editEvent(id, e) {
  e.stopPropagation();
  const evt = events.find(x => x.id === id);
  if (!evt) return;

  document.getElementById('event-id').value = evt.id;
  document.getElementById('event-start-date').value = evt.startDate;
  document.getElementById('event-end-date').value = evt.endDate;
  document.getElementById('event-type').value = evt.type;
  document.getElementById('event-employee').value = evt.employee;
  
  toggleDateRange();
  document.getElementById('modal-title').textContent = 'Редагувати подію';
  document.getElementById('btn-delete').style.display = 'block';
  modal.classList.add('active');
}

function saveEvent(e) {
  e.preventDefault();
  
  const id = document.getElementById('event-id').value || Date.now().toString();
  const startDate = document.getElementById('event-start-date').value;
  const type = document.getElementById('event-type').value;
  const employee = document.getElementById('event-employee').value;
  
  const endDate = type === 'dayoff' ? startDate : document.getElementById('event-end-date').value;

  if (new Date(endDate) < new Date(startDate)) {
    alert('Помилка: Дата закінчення не може бути раніше дати початку!');
    return;
  }

  const eventIndex = events.findIndex(x => x.id === id);
  const newEvent = { id, startDate, endDate, type, employee };

  if (eventIndex > -1) {
    events[eventIndex] = newEvent;
  } else {
    events.push(newEvent);
  }

  localStorage.setItem('hr_events_cache', JSON.stringify(events));
  closeModal();
  renderCalendar();
}

function deleteEvent() {
  const id = document.getElementById('event-id').value;
  events = events.filter(x => x.id !== id);
  localStorage.setItem('hr_events_cache', JSON.stringify(events));
  closeModal();
  renderCalendar();
}
</script>
</body>
</html>
