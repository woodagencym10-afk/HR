<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База Працівників</title>
  <!-- Підключаємо Tailwind CSS для сучасного дизайну -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-50 font-sans p-6">

  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Картки обліку працівників</h1>
      <div id="loading" class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded animate-pulse" style="display: none;">
        Завантаження даних...
      </div>
    </div>

    <!-- КЕРУВАННЯ ТА ФІЛЬТРИ -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-gray-200 mb-6 pb-2">
      <!-- Таби статусів -->
      <div class="flex space-x-6">
        <button onclick="changeFilter('Активні')" id="tab-active" class="py-2 px-1 text-gray-600 hover:text-blue-600 focus:outline-none font-medium tab-active">Активні</button>
        <button onclick="changeFilter('Звільнені')" id="tab-fired" class="py-2 px-1 text-gray-600 hover:text-blue-600 focus:outline-none font-medium">Звільнені</button>
        <button onclick="changeFilter('Всі')" id="tab-all" class="py-2 px-1 text-gray-600 hover:text-blue-600 focus:outline-none font-medium">Всі</button>
      </div>
      
      <!-- Пошуковий рядок -->
      <div class="w-full md:w-72">
        <input type="text" id="search-input" oninput="renderTable()" placeholder="Пошук за ПІБ або відділом..." class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
      </div>
    </div>

    <!-- ГОЛОВНИЙ БЛОК -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- ТАБЛИЦЯ ПРАЦІВНИКІВ -->
      <div class="lg:col-span-2 bg-white p-4 rounded-lg shadow overflow-hidden">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">База співробітників</h2>
        <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50 sticky top-0">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">ID</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">ПІБ / Посада</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Відділ</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Статус</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Дії</th>
              </tr>
            </thead>
            <tbody id="employees-table-body" class="divide-y divide-gray-200 text-sm text-gray-600">
              <!-- Дані завантажуються динамічно -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- ФОРМА ДОДАВАННЯ / РЕДАГУВАННЯ -->
      <div class="bg-white p-6 rounded-lg shadow h-fit sticky top-6">
        <div class="flex justify-between items-center mb-4">
          <h2 id="form-title" class="text-xl font-semibold text-gray-700">Додати працівника</h2>
          <button onclick="resetForm()" id="btn-cancel-edit" class="hidden text-xs text-red-500 hover:underline">Скасувати ред.</button>
        </div>
        
        <form id="employee-form" onsubmit="submitForm(event)" class="space-y-4">
          <!-- Приховане поле для ID -->
          <input type="hidden" id="emp-id">

          <div>
            <label class="block text-xs font-semibold uppercase text-gray-500">ПІБ працівника</label>
            <input type="text" id="pib" required class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500">Відділ</label>
              <input type="text" id="department" required class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500">Посада</label>
              <input type="text" id="position" required class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500">Початок адаптації</label>
              <input type="date" id="adaptationDate" required class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500">Початок роботи</label>
              <input type="date" id="startDate" required class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-500">Статус</label>
              <select id="status" onchange="toggleDismissalDate()" class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none bg-white">
                <option value="Активний">Активний</option>
                <option value="Звільнений">Звільнений</option>
              </select>
            </div>
            <div id="dismissal-date-block" class="opacity-40 pointer-events-none">
              <label class="block text-xs font-semibold uppercase text-gray-500">Дата звільнення</label>
              <input type="date" id="dismissalDate" class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-gray-500">Посилання на папку (Google Диск)</label>
            <input type="url" id="folderUrl" placeholder="https://drive.google.com/..." class="w-full mt-1 p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>

          <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition text-sm shadow">
            Зберегти картку
          </button>
        </form>
      </div>

    </div>
  </div>

  <script>
    // НОВЕ ПОСИЛАННЯ НА GOOGLE APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbxsGtukUdGv3jyAxlOQzV-ES3k_Ze5IvkwWGfowYF51ztVjOy4I4mgjDAXdMOvbjno0uQ/exec';
    
    let allEmployees = [];
    let currentFilter = 'Активні';

    window.onload = function() {
      loadEmployees();
    };

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    // Завантаження даних з API (Google Таблиці)
    async function loadEmployees() {
      showLoading(true);
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        allEmployees = data;
        renderTable();
      } catch (error) {
        console.error('Помилка завантаження:', error);
        alert('Не вдалося завантажити дані з таблиці. Перевірте консоль для деталей.');
      }
      showLoading(false);
    }

    // Відображення таблиці
    function renderTable() {
      const tbody = document.getElementById('employees-table-body');
      tbody.innerHTML = '';
      
      const searchQuery = document.getElementById('search-input').value.toLowerCase();

      const filtered = allEmployees.filter(emp => {
        if (currentFilter !== 'Всі' && emp.status !== currentFilter) return false;
        const matchesPib = emp.pib.toLowerCase().includes(searchQuery);
        const matchesDept = emp.department.toLowerCase().includes(searchQuery);
        return matchesPib || matchesDept;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">Нікого не знайдено</td></tr>`;
        return;
      }

      filtered.forEach(emp => {
        const folderBadge = emp.folderUrl 
          ? `<a href="${emp.folderUrl}" target="_blank" class="text-blue-500 hover:text-blue-700 font-medium inline-flex items-center gap-1">📁 Документи</a>`
          : `<span class="text-gray-300 italic">Немає лінку</span>`;

        const statusClass = emp.status === 'Активний' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';

        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-4 py-3 font-bold text-gray-700">#${emp.id}</td>
            <td class="px-4 py-3">
              <div class="font-semibold text-gray-900">${emp.pib}</div>
              <div class="text-xs text-gray-400">${emp.position}</div>
            </td>
            <td class="px-4 py-3 text-gray-600">${emp.department}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${statusClass}">
                ${emp.status}
              </span>
            </td>
            <td class="px-4 py-3 space-x-3">
              <button onclick="editEmployee(${emp.id})" class="text-blue-600 hover:text-blue-900 hover:underline font-medium">Редагувати</button>
              ${folderBadge}
            </td>
          </tr>
        `;
      });
    }

    // Перемикання вкладок
    function changeFilter(status) {
      currentFilter = status;
      document.getElementById('tab-all').classList.remove('tab-active');
      document.getElementById('tab-active').classList.remove('tab-active');
      document.getElementById('tab-fired').classList.remove('tab-active');
      
      if(status === 'Всі') document.getElementById('tab-all').classList.add('tab-active');
      if(status === 'Активні') document.getElementById('tab-active').classList.add('tab-active');
      if(status === 'Звільнені') document.getElementById('tab-fired').classList.add('tab-active');
      
      renderTable();
    }

    // Блокування/розблокування дати звільнення
    function toggleDismissalDate() {
      const status = document.getElementById('status').value;
      const block = document.getElementById('dismissal-date-block');
      if (status === 'Звільнений') {
        block.classList.remove('opacity-40', 'pointer-events-none');
        document.getElementById('dismissalDate').required = true;
      } else {
        block.classList.add('opacity-40', 'pointer-events-none');
        document.getElementById('dismissalDate').value = '';
        document.getElementById('dismissalDate').required = false;
      }
    }

    // Завантаження даних у форму для редагування
    function editEmployee(id) {
      const emp = allEmployees.find(e => e.id == id);
      if (!emp) return;

      document.getElementById('emp-id').value = emp.id;
      document.getElementById('pib').value = emp.pib;
      document.getElementById('department').value = emp.department;
      document.getElementById('position').value = emp.position;
      document.getElementById('adaptationDate').value = emp.adaptationDate;
      document.getElementById('startDate').value = emp.startDate;
      document.getElementById('status').value = emp.status;
      document.getElementById('folderUrl').value = emp.folderUrl;
      
      toggleDismissalDate();
      if (emp.status === 'Звільнений') {
        document.getElementById('dismissalDate').value = emp.dismissalDate;
      }

      document.getElementById('form-title').innerText = `Редагувати #${emp.id}`;
      document.getElementById('btn-submit').innerText = 'Оновити дані працівника';
      document.getElementById('btn-submit').classList.replace('bg-blue-600', 'bg-yellow-600');
      document.getElementById('btn-submit').classList.replace('hover:bg-blue-700', 'hover:bg-yellow-700');
      document.getElementById('btn-cancel-edit').classList.remove('hidden');
    }

    // Скидання форми
    function resetForm() {
      document.getElementById('employee-form').reset();
      document.getElementById('emp-id').value = '';
      
      document.getElementById('form-title').innerText = 'Додати працівника';
      document.getElementById('btn-submit').innerText = 'Зберегти картку';
      document.getElementById('btn-submit').classList.replace('bg-yellow-600', 'bg-blue-600');
      document.getElementById('btn-submit').classList.replace('hover:bg-yellow-700', 'hover:bg-blue-700');
      document.getElementById('btn-cancel-edit').classList.add('hidden');
      toggleDismissalDate();
    }

    // Відправка даних на API
    async function submitForm(e) {
      e.preventDefault();
      showLoading(true);
      
      const employeeData = {
        id: document.getElementById('emp-id').value,
        pib: document.getElementById('pib').value,
        department: document.getElementById('department').value,
        position: document.getElementById('position').value,
        adaptationDate: document.getElementById('adaptationDate').value,
        startDate: document.getElementById('startDate').value,
        dismissalDate: document.getElementById('dismissalDate').value,
        status: document.getElementById('status').value,
        folderUrl: document.getElementById('folderUrl').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(employeeData)
        });
        
        const result = await response.json();
        
        if(result.success) {
          resetForm();
          await loadEmployees(); // Оновлюємо таблицю
          alert('Дані успішно збережено!');
        } else {
          alert('Помилка: ' + result.error);
        }
      } catch (error) {
        console.error('Помилка відправки:', error);
        alert('Помилка зв\'язку з базою даних. Перевірте консоль.');
      }
      showLoading(false);
    }
  </script>
</body>
</html>
