<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Portal — Працівники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #3B82F6;
    --blue-dark: #2563EB;
    --blue-light: #EFF6FF;
    --green: #22C55E;
    --green-light: #F0FDF4;
    --green-text: #16A34A;
    --red: #EF4444;
    --red-light: #FEF2F2;
    --red-text: #DC2626;
    --ink: #111827;
    --ink-mid: #374151;
    --ink-light: #6B7280;
    --border: #E5E7EB;
    --bg: #F3F4F6;
    --white: #FFFFFF;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 64px;
    gap: 24px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--blue);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 17px; font-weight: 700; color: var(--ink);
    margin-right: 8px;
  }

  .nav { display: flex; gap: 4px; }

  .nav-btn {
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 14px; font-weight: 500;
    color: var(--ink-light);
    background: none; border: none;
    cursor: pointer; text-decoration: none;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }

  .nav-btn:hover { background: var(--bg); color: var(--ink); }

  .nav-btn.active {
    background: var(--blue-light);
    color: var(--blue);
  }

  .nav-btn.danger { color: var(--red); }
  .nav-btn.danger:hover { background: var(--red-light); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .loading-chip {
    display: none;
    font-size: 12px; font-weight: 500;
    color: var(--blue);
    background: var(--blue-light);
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ── PAGE ── */
  .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

  .page-title { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 20px; }

  /* stats row */
  .stats-row { display: flex; gap: 12px; margin-bottom: 24px; }

  .stat-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    min-width: 100px;
  }

  .stat-num {
    font-size: 26px; font-weight: 700; line-height: 1;
    margin-bottom: 4px;
  }

  .stat-num.blue { color: var(--blue); }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }

  .stat-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--ink-light);
    text-transform: uppercase;
  }

  /* main layout */
  .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }

  /* TABLE CARD */
  .table-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }

  .tabs { display: flex; gap: 4px; }

  .tab {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    color: var(--ink-light);
    background: none; border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }

  .tab:hover { background: var(--bg); color: var(--ink); }

  .tab.active { background: var(--blue-light); color: var(--blue); font-weight: 600; }

  .search-input {
    height: 36px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    width: 200px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    background: var(--white);
  }

  .search-input::placeholder { color: #9CA3AF; }

  /* employee list */
  .emp-list { padding: 8px 0; }

  .emp-row {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    gap: 14px;
    transition: background 0.12s;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .emp-row:last-child { border-bottom: none; }
  .emp-row:hover { background: var(--bg); }

  .emp-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
    flex-shrink: 0;
    color: white;
  }

  .emp-info { flex: 1; min-width: 0; }

  .emp-name { font-size: 15px; font-weight: 600; color: var(--ink); }

  .emp-sub { font-size: 12px; color: var(--ink-light); margin-top: 1px; }

  .status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px; font-weight: 600;
    flex-shrink: 0;
  }

  .badge-active { background: var(--green-light); color: var(--green-text); }
  .badge-fired { background: var(--red-light); color: var(--red-text); }

  .emp-btn {
    font-size: 12px; font-weight: 500;
    color: var(--blue);
    background: none; border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .emp-btn:hover { background: var(--blue-light); }

  .emp-doc-btn {
    font-size: 12px; font-weight: 500;
    color: var(--ink-light);
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .emp-doc-btn:hover { background: var(--bg); color: var(--ink); }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-light);
    font-size: 14px;
  }

  /* FORM CARD */
  .form-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    height: fit-content;
    position: sticky;
    top: 84px;
  }

  .form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .form-title { font-size: 16px; font-weight: 700; color: var(--ink); }

  .btn-cancel-edit {
    font-size: 12px; font-weight: 500;
    color: var(--red);
    background: none; border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    display: none;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 12px; font-weight: 500;
    color: var(--ink-light);
    margin-bottom: 5px;
  }

  .field input {
    width: 100%;
    height: 42px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    background: var(--white);
  }

  .field input::placeholder { color: #9CA3AF; }
  .field input[readonly] { cursor: default; background: var(--bg); }

  .status-active-field { color: var(--green-text) !important; font-weight: 600 !important; }
  .status-fired-field { color: var(--red-text) !important; font-weight: 600 !important; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-submit {
    width: 100%;
    height: 44px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }

  .btn-submit:hover { background: var(--blue-dark); }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .form-card { position: static; }
    .stats-row { flex-wrap: wrap; }
  }

  @media (max-width: 600px) {
    .page { padding: 16px; }
    .header { padding: 0 16px; }
    .logo-text { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo-icon">HR</div>
  <div class="logo-text">Portal</div>
  <nav class="nav">
    <a href="index.html" class="nav-btn active">Працівники</a>
    <a href="knowledge.html" class="nav-btn">База знань</a>
  </nav>
  <div class="header-right">
    <div id="loading" class="loading-chip">Оновлення...</div>
    <button onclick="logout()" class="nav-btn danger">Вийти</button>
  </div>
</header>

<!-- PAGE -->
<div class="page">
  <div class="page-title">Картки обліку працівників</div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num blue" id="stat-total">—</div>
      <div class="stat-label">Всього</div>
    </div>
    <div class="stat-card">
      <div class="stat-num green" id="stat-active">—</div>
      <div class="stat-label">Активні</div>
    </div>
    <div class="stat-card">
      <div class="stat-num red" id="stat-fired">—</div>
      <div class="stat-label">Звільнені</div>
    </div>
  </div>

  <div class="main-layout">

    <!-- TABLE -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="tabs">
          <button class="tab active" id="tab-active" onclick="changeFilter('Активні')">Активні</button>
          <button class="tab" id="tab-fired" onclick="changeFilter('Звільнені')">Звільнені</button>
          <button class="tab" id="tab-all" onclick="changeFilter('Всі')">Всі</button>
        </div>
        <input type="text" class="search-input" id="search-input" oninput="renderTable()" placeholder="Пошук за ПІБ або відділом...">
      </div>
      <div class="emp-list" id="employees-table-body"></div>
    </div>

    <!-- FORM -->
    <div class="form-card">
      <div class="form-header">
        <div class="form-title" id="form-title">Додати працівника</div>
        <button class="btn-cancel-edit" id="btn-cancel-edit" onclick="resetForm()">✕ Скасувати</button>
      </div>

      <form id="employee-form" onsubmit="submitForm(event)">
        <input type="hidden" id="emp-id">

        <div class="field">
          <label>ПІБ працівника</label>
          <input type="text" id="pib" required placeholder="Прізвище Ім'я По-батькові">
        </div>

        <div class="field-row">
          <div class="field">
            <label>Відділ</label>
            <input type="text" id="department" required placeholder="Продажі">
          </div>
          <div class="field">
            <label>Посада</label>
            <input type="text" id="position" required placeholder="Менеджер">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Початок адаптації</label>
            <input type="date" id="adaptationDate" required>
          </div>
          <div class="field">
            <label>Початок роботи</label>
            <input type="date" id="startDate" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Дата звільнення</label>
            <input type="date" id="dismissalDate" onchange="autoUpdateStatus()">
          </div>
          <div class="field">
            <label>Статус</label>
            <input type="text" id="status" value="Активний" readonly class="status-active-field">
          </div>
        </div>

        <div class="field">
          <label>Посилання на папку</label>
          <input type="url" id="folderUrl" placeholder="https://drive.google.com/...">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Зберегти картку</button>
      </form>
    </div>

  </div>
</div>

<script>
if (!localStorage.getItem('hr_logged')) window.location.href = 'login.html';

const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';
let allEmployees = [];
let currentFilter = 'Активні';

const AVATAR_COLORS = ['#3B82F6','#8B5CF6','#EC4899','#F59E0B','#10B981','#6366F1','#EF4444','#14B8A6'];

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function getInitials(name) {
  const parts = (name || '').trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (name || '?')[0].toUpperCase();
}

function showLoading(v) { document.getElementById('loading').style.display = v ? 'block' : 'none'; }

function logout() { localStorage.clear(); window.location.href = 'login.html'; }

window.onload = loadEmployees;

async function loadEmployees() {
  const cached = localStorage.getItem('hr_employees_cache');
  if (cached) { allEmployees = JSON.parse(cached); renderTable(); updateStats(); }
  else showLoading(true);
  try {
    const login = localStorage.getItem('hr_user');
    const password = localStorage.getItem('hr_pass');
    const res = await fetch(API_URL + '?login=' + encodeURIComponent(login) + '&password=' + encodeURIComponent(password));
    const result = await res.json();
    if (result.success) {
      allEmployees = result.data || [];
      localStorage.setItem('hr_employees_cache', JSON.stringify(allEmployees));
      renderTable(); updateStats();
    } else { localStorage.clear(); window.location.href = 'login.html'; }
  } catch(e) { console.error(e); if (!cached) alert('Помилка завантаження'); }
  showLoading(false);
}

function updateStats() {
  document.getElementById('stat-total').textContent = allEmployees.length;
  document.getElementById('stat-active').textContent = allEmployees.filter(e => e.status === 'Активний').length;
  document.getElementById('stat-fired').textContent = allEmployees.filter(e => e.status === 'Звільнений').length;
}

function renderTable() {
  const container = document.getElementById('employees-table-body');
  container.innerHTML = '';
  const q = document.getElementById('search-input').value.toLowerCase();

  const filtered = allEmployees.filter(emp => {
    if (currentFilter === 'Активні' && emp.status !== 'Активний') return false;
    if (currentFilter === 'Звільнені' && emp.status !== 'Звільнений') return false;
    return (emp.pib||'').toLowerCase().includes(q) || (emp.department||'').toLowerCase().includes(q);
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state">Нікого не знайдено</div>`;
    return;
  }

  filtered.forEach(emp => {
    const isActive = emp.status === 'Активний';
    const initials = getInitials(emp.pib);
    const color = getAvatarColor(emp.pib);
    const folderBtn = emp.folderUrl
      ? `<a href="${emp.folderUrl}" target="_blank" class="emp-doc-btn">📁 Документи</a>` : '';

    const row = document.createElement('div');
    row.className = 'emp-row';
    row.innerHTML = `
      <div class="emp-avatar" style="background:${color}">${initials}</div>
      <div class="emp-info">
        <div class="emp-name">${emp.pib}</div>
        <div class="emp-sub">${emp.department} · ${emp.position}</div>
      </div>
      <span class="status-badge ${isActive ? 'badge-active' : 'badge-fired'}">${emp.status}</span>
      <button class="emp-btn" onclick="editEmployee(${emp.id})">Редагувати</button>
      ${folderBtn}
    `;
    container.appendChild(row);
  });
}

function changeFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const map = { 'Активні': 'tab-active', 'Звільнені': 'tab-fired', 'Всі': 'tab-all' };
  document.getElementById(map[f]).classList.add('active');
  renderTable();
}

function autoUpdateStatus() {
  const val = document.getElementById('dismissalDate').value;
  const s = document.getElementById('status');
  s.value = val ? 'Звільнений' : 'Активний';
  s.className = val ? 'status-fired-field' : 'status-active-field';
}

function editEmployee(id) {
  const emp = allEmployees.find(e => e.id == id);
  if (!emp) return;
  document.getElementById('emp-id').value = emp.id;
  document.getElementById('pib').value = emp.pib;
  document.getElementById('department').value = emp.department;
  document.getElementById('position').value = emp.position;
  document.getElementById('adaptationDate').value = emp.adaptationDate;
  document.getElementById('startDate').value = emp.startDate;
  document.getElementById('dismissalDate').value = emp.dismissalDate;
  document.getElementById('folderUrl').value = emp.folderUrl;
  autoUpdateStatus();
  document.getElementById('form-title').textContent = `Редагувати #${emp.id}`;
  document.getElementById('btn-submit').textContent = 'Оновити дані';
  document.getElementById('btn-cancel-edit').style.display = 'block';
  document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
}

function resetForm() {
  document.getElementById('employee-form').reset();
  document.getElementById('emp-id').value = '';
  document.getElementById('status').value = 'Активний';
  document.getElementById('status').className = 'status-active-field';
  document.getElementById('form-title').textContent = 'Додати працівника';
  document.getElementById('btn-submit').textContent = 'Зберегти картку';
  document.getElementById('btn-cancel-edit').style.display = 'none';
}

async function submitForm(e) {
  e.preventDefault();
  showLoading(true);
  const data = {
    action: 'addEmployee',
    login: localStorage.getItem('hr_user'),
    password: localStorage.getItem('hr_pass'),
    id: document.getElementById('emp-id').value,
    pib: document.getElementById('pib').value,
    department: document.getElementById('department').value,
    position: document.getElementById('position').value,
    adaptationDate: document.getElementById('adaptationDate').value,
    startDate: document.getElementById('startDate').value,
    dismissalDate: document.getElementById('dismissalDate').value,
    status: document.getElementById('status').value,
    folderUrl: document.getElementById('folderUrl').value
  };
  try {
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(data) });
    const result = await res.json();
    if (result.success) {
      resetForm();
      localStorage.removeItem('hr_employees_cache');
      await loadEmployees();
      alert('Дані успішно збережено!');
    } else { alert('Помилка: ' + result.error); }
  } catch(err) { console.error(err); alert('Помилка звʼязку з сервером'); }
  showLoading(false);
}
</script>
</body>
</html>
