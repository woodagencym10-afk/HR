<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База Працівників</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>

    *{
      scroll-behavior:smooth;
    }

    body{
      background:
        radial-gradient(circle at top left, rgba(34,197,94,0.06), transparent 30%),
        radial-gradient(circle at bottom right, rgba(37,99,235,0.08), transparent 35%),
        linear-gradient(145deg,#020617,#07110f,#08131c);

      min-height:100vh;

      color:white;

      position:relative;

      overflow-x:hidden;
    }

    /* GLOW */

    body::before{

      content:'';

      position:fixed;

      width:700px;
      height:700px;

      background:rgba(34,197,94,0.05);

      border-radius:50%;

      filter:blur(120px);

      top:-300px;
      left:-250px;

      z-index:0;
    }

    body::after{

      content:'';

      position:fixed;

      width:700px;
      height:700px;

      background:rgba(37,99,235,0.05);

      border-radius:50%;

      filter:blur(120px);

      bottom:-350px;
      right:-250px;

      z-index:0;
    }

    /* GRID */

    .background-grid{

      position:fixed;

      inset:0;

      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);

      background-size:60px 60px;

      opacity:0.7;

      mask-image:
        radial-gradient(circle at center, black 45%, transparent 100%);

      pointer-events:none;

      z-index:0;
    }

    /* GLASS */

    .glass{

      background:rgba(7,15,13,0.82);

      backdrop-filter:blur(22px);

      border:1px solid rgba(255,255,255,0.06);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);

      border-radius:24px;
    }

    /* NAV */

    .nav-btn{

      padding:10px 18px;

      border-radius:14px;

      transition:0.25s;

      font-weight:600;

      color:rgba(255,255,255,0.7);
    }

    .nav-btn:hover{
      background:rgba(255,255,255,0.04);
    }

    .nav-active{

      background:
        linear-gradient(145deg,#166534,#2563eb);

      color:white;
    }

    /* TABS */

    .tab-active {
      border-bottom: 2px solid #22c55e;
      color: #22c55e;
      font-weight: bold;
    }

    /* TABLE */

    table{
      color:#d1d5db;
    }

    thead{
      background:rgba(255,255,255,0.03) !important;
    }

    tbody tr{
      transition:0.2s;
    }

    tbody tr:hover{
      background:rgba(255,255,255,0.03) !important;
    }

    /* INPUTS */

    input{

      background:rgba(255,255,255,0.03) !important;

      border:1px solid rgba(255,255,255,0.06) !important;

      color:white !important;

      border-radius:14px !important;
    }

    input::placeholder{
      color:rgba(255,255,255,0.3);
    }

    input:focus{

      outline:none !important;

      border-color:rgba(34,197,94,0.4) !important;

      box-shadow:
        0 0 0 4px rgba(34,197,94,0.08) !important;
    }

    /* BUTTON */

    .green-btn{

      background:
        linear-gradient(145deg,#166534,#2563eb);

      transition:0.3s;

      border-radius:16px;
    }

    .green-btn:hover{

      transform:translateY(-2px);

      box-shadow:
        0 15px 35px rgba(37,99,235,0.20);
    }

    /* TEXT */

    .title{
      color:white !important;
    }

    .muted{
      color:rgba(255,255,255,0.5) !important;
    }

    /* SCROLL */

    ::-webkit-scrollbar{
      width:8px;
      height:8px;
    }

    ::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,0.12);
      border-radius:10px;
    }

  </style>
</head>

<body class="font-sans p-6">

<div class="background-grid"></div>

<script>

  if (!localStorage.getItem('hr_logged')) {
    window.location.href = 'login.html';
  }

</script>

<div class="max-w-7xl mx-auto relative z-10">

  <!-- NAV -->

  <nav class="flex gap-4 mb-8 glass p-2 w-fit">

    <a href="index.html" class="nav-btn nav-active">
      База працівників
    </a>

    <a href="knowledge.html" class="nav-btn">
      База знань
    </a>

    <button onclick="logout()" class="nav-btn text-red-400 hover:bg-red-500 hover:bg-opacity-10">
      Вийти
    </button>

  </nav>

  <!-- HEADER -->

  <div class="flex justify-between items-center mb-6">

    <h1 class="text-3xl font-bold title">
      Картки обліку працівників
    </h1>

    <div id="loading"
      class="text-sm font-semibold text-green-400 bg-green-500 bg-opacity-10 px-4 py-2 rounded-xl animate-pulse"
      style="display:none;">

      <i class="fas fa-sync-alt fa-spin mr-1"></i>
      Оновлення даних...

    </div>

  </div>

  <!-- FILTERS -->

  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-white border-opacity-10 mb-6 pb-2">

    <div class="flex space-x-6">

      <button onclick="changeFilter('Активні')" id="tab-active"
        class="py-2 px-1 muted hover:text-green-400 focus:outline-none font-medium tab-active">
        Активні
      </button>

      <button onclick="changeFilter('Звільнені')" id="tab-fired"
        class="py-2 px-1 muted hover:text-green-400 focus:outline-none font-medium">
        Звільнені
      </button>

      <button onclick="changeFilter('Всі')" id="tab-all"
        class="py-2 px-1 muted hover:text-green-400 focus:outline-none font-medium">
        Всі
      </button>

    </div>

    <div class="w-full md:w-72">

      <input
        type="text"
        id="search-input"
        oninput="renderTable()"
        placeholder="Пошук..."
        class="w-full p-3 text-sm">

    </div>

  </div>

  <!-- CONTENT -->

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- TABLE -->

    <div class="lg:col-span-2 glass p-4 overflow-hidden">

      <h2 class="text-xl font-semibold text-white mb-4">
        База співробітників
      </h2>

      <div class="overflow-x-auto max-h-[600px] overflow-y-auto">

        <table class="min-w-full divide-y divide-white divide-opacity-10">

          <thead class="sticky top-0">

            <tr>

              <th class="px-4 py-3 text-left text-xs font-semibold uppercase muted">
                ID
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold uppercase muted">
                ПІБ / Посада
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold uppercase muted">
                Відділ
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold uppercase muted">
                Статус
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold uppercase muted">
                Дії
              </th>

            </tr>

          </thead>

          <tbody id="employees-table-body"
            class="divide-y divide-white divide-opacity-10 text-sm">
          </tbody>

        </table>

      </div>

    </div>

    <!-- FORM -->

    <div class="glass p-6 h-fit sticky top-6">

      <div class="flex justify-between items-center mb-4">

        <h2 id="form-title" class="text-xl font-semibold text-white">
          Додати працівника
        </h2>

        <button onclick="resetForm()"
          id="btn-cancel-edit"
          class="hidden text-xs text-red-400 hover:underline">

          Скасувати

        </button>

      </div>

      <form id="employee-form" onsubmit="submitForm(event)" class="space-y-4">

        <input type="hidden" id="emp-id">

        <div>

          <label class="block text-xs font-semibold uppercase muted">
            ПІБ працівника
          </label>

          <input type="text" id="pib" required class="w-full mt-1 p-3 text-sm">

        </div>

        <div class="grid grid-cols-2 gap-4">

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Відділ
            </label>

            <input type="text" id="department" required class="w-full mt-1 p-3 text-sm">

          </div>

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Посада
            </label>

            <input type="text" id="position" required class="w-full mt-1 p-3 text-sm">

          </div>

        </div>

        <div class="grid grid-cols-2 gap-4">

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Початок адаптації
            </label>

            <input type="date" id="adaptationDate" required class="w-full mt-1 p-3 text-sm">

          </div>

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Початок роботи
            </label>

            <input type="date" id="startDate" required class="w-full mt-1 p-3 text-sm">

          </div>

        </div>

        <div class="grid grid-cols-2 gap-4">

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Дата звільнення
            </label>

            <input type="date" id="dismissalDate" onchange="autoUpdateStatus()" class="w-full mt-1 p-3 text-sm">

          </div>

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Статус
            </label>

            <input type="text"
              id="status"
              value="Активний"
              readonly
              class="w-full mt-1 p-3 text-sm bg-opacity-20 text-green-400 font-bold">

          </div>

        </div>

        <div>

          <label class="block text-xs font-semibold uppercase muted">
            Посилання на папку
          </label>

          <input type="url"
            id="folderUrl"
            placeholder="https://drive.google.com/..."
            class="w-full mt-1 p-3 text-sm">

        </div>

        <button type="submit"
          id="btn-submit"
          class="w-full green-btn text-white font-bold py-3 px-4 transition text-sm shadow">

          Зберегти картку

        </button>

      </form>

    </div>

  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';

let allEmployees = [];
let currentFilter = 'Активні';

window.onload = function() {
  loadEmployees();
};

function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'block' : 'none';
}

function logout() {
  localStorage.clear();
  window.location.href = 'login.html';
}

async function loadEmployees() {

  const cachedData = localStorage.getItem('hr_employees_cache');

  if (cachedData) {
    allEmployees = JSON.parse(cachedData);
    renderTable();
  } else {
    showLoading(true);
  }

  try {

    const login = localStorage.getItem('hr_user');
    const password = localStorage.getItem('hr_pass');

    const response = await fetch(
      API_URL +
      '?login=' + encodeURIComponent(login) +
      '&password=' + encodeURIComponent(password)
    );

    const result = await response.json();

    if (result.success) {

      allEmployees = result.data || [];

      localStorage.setItem(
        'hr_employees_cache',
        JSON.stringify(allEmployees)
      );

      renderTable();

    } else {

      localStorage.clear();
      window.location.href = 'login.html';

    }

  } catch (error) {

    console.error(error);

    if (!cachedData) {
      alert('Помилка завантаження');
    }

  }

  showLoading(false);
}

function renderTable() {

  const tbody = document.getElementById('employees-table-body');

  tbody.innerHTML = '';

  const searchQuery =
    document.getElementById('search-input')
    .value
    .toLowerCase();

  const filtered = allEmployees.filter(emp => {

    if (currentFilter === 'Активні' && emp.status !== 'Активний') return false;
    if (currentFilter === 'Звільнені' && emp.status !== 'Звільнений') return false;

    const matchesPib =
      (emp.pib || '').toLowerCase().includes(searchQuery);

    const matchesDept =
      (emp.department || '').toLowerCase().includes(searchQuery);

    return matchesPib || matchesDept;

  });

  if (filtered.length === 0) {

    tbody.innerHTML =
      `<tr>
        <td colspan="5" class="px-4 py-8 text-center muted">
          Нікого не знайдено
        </td>
      </tr>`;

    return;
  }

  filtered.forEach(emp => {

    const folderBadge = emp.folderUrl

      ? `<a href="${emp.folderUrl}" target="_blank"
            class="text-green-400 hover:text-blue-400 font-medium">
            📁 Документи
         </a>`

      : `<span class="text-gray-500 italic">
            Немає
         </span>`;

    const statusClass =
      emp.status === 'Активний'
      ? 'bg-green-500 bg-opacity-20 text-green-400'
      : 'bg-red-500 bg-opacity-20 text-red-400';

    tbody.innerHTML += `
      <tr>

        <td class="px-4 py-3 font-bold text-white">
          #${emp.id}
        </td>

        <td class="px-4 py-3">

          <div class="font-semibold text-white">
            ${emp.pib}
          </div>

          <div class="text-xs muted">
            ${emp.position}
          </div>

        </td>

        <td class="px-4 py-3">
          ${emp.department}
        </td>

        <td class="px-4 py-3">

          <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusClass}">
            ${emp.status}
          </span>

        </td>

        <td class="px-4 py-3 space-x-3">

          <button
            onclick="editEmployee(${emp.id})"
            class="text-blue-400 hover:text-blue-300 font-medium">

            Редагувати

          </button>

          ${folderBadge}

        </td>

      </tr>
    `;
  });
}

function changeFilter(status) {

  currentFilter = status;

  document.getElementById('tab-all').classList.remove('tab-active');
  document.getElementById('tab-active').classList.remove('tab-active');
  document.getElementById('tab-fired').classList.remove('tab-active');

  if (status === 'Всі')
    document.getElementById('tab-all').classList.add('tab-active');

  if (status === 'Активні')
    document.getElementById('tab-active').classList.add('tab-active');

  if (status === 'Звільнені')
    document.getElementById('tab-fired').classList.add('tab-active');

  renderTable();
}

function autoUpdateStatus() {

  const dateVal =
    document.getElementById('dismissalDate').value;

  const statusField =
    document.getElementById('status');

  if (dateVal) {

    statusField.value = 'Звільнений';

    statusField.classList.remove('text-green-400');

    statusField.classList.add('text-red-400');

  } else {

    statusField.value = 'Активний';

    statusField.classList.remove('text-red-400');

    statusField.classList.add('text-green-400');
  }
}
</script>

</body>
</html>
