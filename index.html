<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>База Працівників</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      background:
        radial-gradient(circle at top left, rgba(16,185,129,0.05), transparent 30%),
        radial-gradient(circle at bottom right, rgba(37,99,235,0.06), transparent 35%),
        #050816;

      color:white;

      overflow-x:hidden;

      position:relative;
    }

    /* GRID */

    body::before{

      content:'';

      position:fixed;

      inset:0;

      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);

      background-size:60px 60px;

      mask-image:
        radial-gradient(circle at center, black 40%, transparent 100%);

      pointer-events:none;

      z-index:0;
    }

    /* glow */

    body::after{

      content:'';

      position:fixed;

      width:700px;
      height:700px;

      background:rgba(16,185,129,0.05);

      filter:blur(120px);

      border-radius:50%;

      top:-300px;
      left:-300px;

      z-index:0;
    }

    .main-content{
      position:relative;
      z-index:2;
    }

    /* glass */

    .glass{

      background:rgba(12,18,35,0.72);

      backdrop-filter:blur(18px);

      border:1px solid rgba(255,255,255,0.05);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.35);

      border-radius:24px;
    }

    /* nav */

    .nav-btn{

      padding:12px 18px;

      border-radius:14px;

      transition:0.25s;

      color:rgba(255,255,255,0.65);

      font-weight:500;
    }

    .nav-btn:hover{

      background:rgba(255,255,255,0.04);

      color:white;
    }

    .nav-active{

      background:
        linear-gradient(145deg,#0f766e,#2563eb);

      color:white;
    }

    /* tabs */

    .tab-active{

      color:#34d399;

      border-bottom:2px solid #34d399;

      font-weight:600;
    }

    /* table */

    table{
      color:rgba(255,255,255,0.75);
    }

    thead{
      background:rgba(255,255,255,0.03);
    }

    tbody tr{
      transition:0.2s;
    }

    tbody tr:hover{
      background:rgba(255,255,255,0.03);
    }

    /* inputs */

    input{

      background:rgba(255,255,255,0.03) !important;

      border:1px solid rgba(255,255,255,0.06) !important;

      border-radius:16px !important;

      color:white !important;
    }

    input::placeholder{
      color:rgba(255,255,255,0.28);
    }

    input:focus{

      outline:none !important;

      border-color:rgba(52,211,153,0.35) !important;

      box-shadow:
        0 0 0 4px rgba(52,211,153,0.08) !important;
    }

    /* button */

    .main-btn{

      background:
        linear-gradient(145deg,#0f766e,#2563eb);

      border:none;

      border-radius:16px;

      transition:0.3s;
    }

    .main-btn:hover{

      transform:translateY(-2px);

      box-shadow:
        0 15px 35px rgba(37,99,235,0.18);
    }

    /* text */

    .muted{
      color:rgba(255,255,255,0.45) !important;
    }

    .title-white{
      color:white !important;
    }

    /* scrollbar */

    ::-webkit-scrollbar{
      width:8px;
      height:8px;
    }

    ::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,0.12);
      border-radius:10px;
    }

  </style>
</head>

<body class="font-sans p-6">

<div class="main-content">

<script>
  if (!localStorage.getItem('hr_logged')) {
    window.location.href = 'login.html';
  }
</script>

<div class="max-w-7xl mx-auto">

  <!-- NAV -->

  <nav class="flex gap-4 mb-8 glass p-2 w-fit">

    <a href="index.html" class="nav-btn nav-active">
      База працівників
    </a>

    <a href="knowledge.html" class="nav-btn">
      База знань
    </a>

    <button onclick="logout()" class="nav-btn text-red-400">
      Вийти
    </button>

  </nav>

  <!-- HEADER -->

  <div class="flex justify-between items-center mb-6">

    <h1 class="text-3xl font-bold title-white">
      Картки обліку працівників
    </h1>

    <div id="loading"
      class="text-sm font-semibold text-green-400 bg-green-500 bg-opacity-10 px-4 py-2 rounded-xl animate-pulse"
      style="display:none;">

      <i class="fas fa-sync-alt fa-spin mr-1"></i>
      Оновлення даних...

    </div>

  </div>

  <!-- FILTERS -->

  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-white border-opacity-10 mb-6 pb-2">

    <div class="flex space-x-6">

      <button onclick="changeFilter('Активні')" id="tab-active"
        class="py-2 px-1 muted hover:text-green-400 focus:outline-none font-medium tab-active">
        Активні
      </button>

      <button onclick="changeFilter('Звільнені')" id="tab-fired"
        class="py-2 px-1 muted hover:text-green-400 focus:outline-none font-medium">
        Звільнені
      </button>

      <button onclick="changeFilter('Всі')" id="tab-all"
        class="py-2 px-1 muted hover:text-green-400 focus:outline-none font-medium">
        Всі
      </button>

    </div>

    <div class="w-full md:w-72">

      <input type="text"
        id="search-input"
        oninput="renderTable()"
        placeholder="Пошук за ПІБ або відділом..."
        class="w-full p-3 text-sm">

    </div>

  </div>

  <!-- CONTENT -->

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- TABLE -->

    <div class="lg:col-span-2 glass p-4 overflow-hidden">

      <h2 class="text-xl font-semibold title-white mb-4">
        База співробітників
      </h2>

      <div class="overflow-x-auto max-h-[600px] overflow-y-auto">

        <table class="min-w-full divide-y divide-white divide-opacity-10">

          <thead class="sticky top-0">

            <tr>

              <th class="px-4 py-3 text-left text-xs font-semibold muted uppercase">
                ID
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold muted uppercase">
                ПІБ / Посада
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold muted uppercase">
                Відділ
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold muted uppercase">
                Статус
              </th>

              <th class="px-4 py-3 text-left text-xs font-semibold muted uppercase">
                Дії
              </th>

            </tr>

          </thead>

          <tbody id="employees-table-body"
            class="divide-y divide-white divide-opacity-10 text-sm text-gray-300">
          </tbody>

        </table>

      </div>

    </div>

    <!-- FORM -->

    <div class="glass p-6 h-fit sticky top-6">

      <div class="flex justify-between items-center mb-4">

        <h2 id="form-title" class="text-xl font-semibold title-white">
          Додати працівника
        </h2>

        <button onclick="resetForm()"
          id="btn-cancel-edit"
          class="hidden text-xs text-red-400 hover:underline">

          Скасувати ред.

        </button>

      </div>

      <form id="employee-form" onsubmit="submitForm(event)" class="space-y-4">

        <input type="hidden" id="emp-id">

        <div>

          <label class="block text-xs font-semibold uppercase muted">
            ПІБ працівника
          </label>

          <input type="text"
            id="pib"
            required
            class="w-full mt-1 p-3 text-sm">

        </div>

        <div class="grid grid-cols-2 gap-4">

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Відділ
            </label>

            <input type="text"
              id="department"
              required
              class="w-full mt-1 p-3 text-sm">

          </div>

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Посада
            </label>

            <input type="text"
              id="position"
              required
              class="w-full mt-1 p-3 text-sm">

          </div>

        </div>

        <div class="grid grid-cols-2 gap-4">

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Початок адаптації
            </label>

            <input type="date"
              id="adaptationDate"
              required
              class="w-full mt-1 p-3 text-sm">

          </div>

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Початок роботи
            </label>

            <input type="date"
              id="startDate"
              required
              class="w-full mt-1 p-3 text-sm">

          </div>

        </div>

        <div class="grid grid-cols-2 gap-4">

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Дата звільнення
            </label>

            <input type="date"
              id="dismissalDate"
              onchange="autoUpdateStatus()"
              class="w-full mt-1 p-3 text-sm">

          </div>

          <div>

            <label class="block text-xs font-semibold uppercase muted">
              Статус
            </label>

            <input type="text"
              id="status"
              value="Активний"
              readonly
              class="w-full mt-1 p-3 text-sm text-green-400 font-bold">

          </div>

        </div>

        <div>

          <label class="block text-xs font-semibold uppercase muted">
            Посилання на папку
          </label>

          <input type="url"
            id="folderUrl"
            placeholder="https://drive.google.com/..."
            class="w-full mt-1 p-3 text-sm">

        </div>

        <button type="submit"
          id="btn-submit"
          class="w-full main-btn text-white font-bold py-3 px-4 transition text-sm shadow">

          Зберегти картку

        </button>

      </form>

    </div>

  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyqUgEf1WvOIhibm9Omx5RTtPsPUgzSnk2YXjnV7wYqYcts41COBrsBLvGcVfaIi26X9Q/exec';

let allEmployees = [];
let currentFilter = 'Активні';

window.onload = function() {
  loadEmployees();
};

function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'block' : 'none';
}

function logout() {
  localStorage.clear();
  window.location.href = 'login.html';
}

// ======================================
// LOAD EMPLOYEES
// ======================================
async function loadEmployees() {
  const cachedData = localStorage.getItem('hr_employees_cache');

  if (cachedData) {
    allEmployees = JSON.parse(cachedData);
    renderTable();
  } else {
    showLoading(true);
  }

  try {
    const login = localStorage.getItem('hr_user');
    const password = localStorage.getItem('hr_pass');

    const response = await fetch(
      API_URL +
      '?login=' + encodeURIComponent(login) +
      '&password=' + encodeURIComponent(password)
    );

    const result = await response.json();

    if (result.success) {
      allEmployees = result.data || [];
      localStorage.setItem('hr_employees_cache', JSON.stringify(allEmployees));
      renderTable();
    } else {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  } catch (error) {
    console.error(error);
    if (!cachedData) {
      alert('Помилка завантаження');
    }
  }

  showLoading(false);
}

// ======================================
// RENDER TABLE
// ======================================
function renderTable() {
  const tbody = document.getElementById('employees-table-body');
  tbody.innerHTML = '';

  const searchQuery = document.getElementById('search-input').value.toLowerCase();

  const filtered = allEmployees.filter(emp => {
    if (currentFilter === 'Активні' && emp.status !== 'Активний') return false;
    if (currentFilter === 'Звільнені' && emp.status !== 'Звільнений') return false;

    const matchesPib = (emp.pib || '').toLowerCase().includes(searchQuery);
    const matchesDept = (emp.department || '').toLowerCase().includes(searchQuery);

    return matchesPib || matchesDept;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="px-4 py-8 text-center muted">
          Нікого не знайдено
        </td>
      </tr>`;
    return;
  }

  filtered.forEach(emp => {

    const folderBadge = emp.folderUrl
      ? `<a href="${emp.folderUrl}" target="_blank" class="text-green-400 hover:text-blue-400 font-medium inline-flex items-center gap-1">📁 Документи</a>`
      : `<span class="muted italic">Немає лінку</span>`;

    const statusClass = emp.status === 'Активний'
      ? 'bg-green-500 bg-opacity-10 text-green-400'
      : 'bg-red-500 bg-opacity-10 text-red-400';

    tbody.innerHTML += `
      <tr class="transition">

        <td class="px-4 py-3 font-bold title-white">
          #${emp.id}
        </td>

        <td class="px-4 py-3">

          <div class="font-semibold title-white">
            ${emp.pib}
          </div>

          <div class="text-xs muted">
            ${emp.position}
          </div>

        </td>

        <td class="px-4 py-3 muted">
          ${emp.department}
        </td>

        <td class="px-4 py-3">

          <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusClass}">
            ${emp.status}
          </span>

        </td>

        <td class="px-4 py-3 space-x-3">

          <button onclick="editEmployee(${emp.id})"
            class="text-blue-400 hover:text-blue-300 font-medium">

            Редагувати

          </button>

          ${folderBadge}

        </td>

      </tr>
    `;
  });
}

function changeFilter(status) {
  currentFilter = status;

  document.getElementById('tab-all').classList.remove('tab-active');
  document.getElementById('tab-active').classList.remove('tab-active');
  document.getElementById('tab-fired').classList.remove('tab-active');

  if (status === 'Всі') document.getElementById('tab-all').classList.add('tab-active');
  if (status === 'Активні') document.getElementById('tab-active').classList.add('tab-active');
  if (status === 'Звільнені') document.getElementById('tab-fired').classList.add('tab-active');

  renderTable();
}

function autoUpdateStatus() {
  const dateVal = document.getElementById('dismissalDate').value;
  const statusField = document.getElementById('status');

  if (dateVal) {
    statusField.value = 'Звільнений';
    statusField.classList.remove('text-green-600');
    statusField.classList.add('text-red-400');
  } else {
    statusField.value = 'Активний';
    statusField.classList.remove('text-red-400');
    statusField.classList.add('text-green-400');
  }
}

function editEmployee(id) {
  const emp = allEmployees.find(e => e.id == id);

  if (!emp) return;

  document.getElementById('emp-id').value = emp.id;
  document.getElementById('pib').value = emp.pib;
  document.getElementById('department').value = emp.department;
  document.getElementById('position').value = emp.position;
  document.getElementById('adaptationDate').value = emp.adaptationDate;
  document.getElementById('startDate').value = emp.startDate;
  document.getElementById('dismissalDate').value = emp.dismissalDate;
  document.getElementById('folderUrl').value = emp.folderUrl;

  autoUpdateStatus();

  document.getElementById('form-title').innerText = `Редагувати #${emp.id}`;
  document.getElementById('btn-submit').innerText = 'Оновити дані працівника';

  document.getElementById('btn-submit').classList.replace('bg-blue-600', 'bg-yellow-600');
  document.getElementById('btn-submit').classList.replace('hover:bg-blue-700', 'hover:bg-yellow-700');

  document.getElementById('btn-cancel-edit').classList.remove('hidden');
}

function resetForm() {

  document.getElementById('employee-form').reset();

  document.getElementById('emp-id').value = '';

  autoUpdateStatus();

  document.getElementById('form-title').innerText = 'Додати працівника';
  document.getElementById('btn-submit').innerText = 'Зберегти картку';

  document.getElementById('btn-submit').classList.replace('bg-yellow-600', 'bg-blue-600');
  document.getElementById('btn-submit').classList.replace('hover:bg-yellow-700', 'hover:bg-blue-700');

  document.getElementById('btn-cancel-edit').classList.add('hidden');
}

// ======================================
// SUBMIT
// ======================================
async function submitForm(e) {

  e.preventDefault();

  showLoading(true);

  const employeeData = {

    action: 'addEmployee',

    login: localStorage.getItem('hr_user'),
    password: localStorage.getItem('hr_pass'),

    id: document.getElementById('emp-id').value,
    pib: document.getElementById('pib').value,
    department: document.getElementById('department').value,
    position: document.getElementById('position').value,
    adaptationDate: document.getElementById('adaptationDate').value,
    startDate: document.getElementById('startDate').value,
    dismissalDate: document.getElementById('dismissalDate').value,
    status: document.getElementById('status').value,
    folderUrl: document.getElementById('folderUrl').value
  };

  try {

    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(employeeData)
    });

    const result = await response.json();

    if (result.success) {

      resetForm();

      localStorage.removeItem('hr_employees_cache');

      await loadEmployees();

      alert('Дані успішно збережено!');

    } else {

      alert('Помилка: ' + result.error);
    }

  } catch (error) {

    console.error(error);

    alert('Помилка звʼязку з сервером');
  }

  showLoading(false);
}
</script>

</div>

</body>
</html>
